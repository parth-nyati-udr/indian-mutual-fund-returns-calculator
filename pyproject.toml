[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mf-analytics"
version = "1.0.0"
description = "XIRR, SIP simulation and rolling returns for Indian mutual funds (mfapi.in)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["pandas>=2.0", "numpy>=1.24", "scipy>=1.10", "requests>=2.31"]

[project.optional-dependencies]
excel = ["openpyxl>=3.1"]
dev = ["pytest>=8"]

[tool.setuptools]
packages = ["mf_analytics"]

[tool.pytest.ini_options]
pythonpath = ["."]
